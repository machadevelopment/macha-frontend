<!--
  Favicon de la app — isotipo monocromo (pedido de Keneth, 2026-08-21).

  ═══ ANTES DE ESTO EL FAVICON NO SE SERVÍA, Y ESA ERA LA MITAD INVISIBLE DEL PEDIDO ═══

  El archivo existía y era correcto, pero `middleware.ts` lo interceptaba: su matcher excluía
  `favicon.ico` —que no existe— y NO `icon.svg`, que sí. Verificado en producción antes de
  tocar nada: `GET /icon.svg` respondía **307 hacia api.workos.com**, así que el navegador
  pedía el ícono y recibía un redirect al login. La pestaña quedaba con el genérico.

  Es el mismo bug del logo de los correos (CU del 2026-08-20), en el mismo matcher. Peor: esa
  vez usé `/icon.svg` como EVIDENCIA de que el middleware redirige, y no vi que lo que estaba
  documentando era un defecto activo. Queda anotado porque el archivo puede volver a verse
  perfecto y no llegar nunca al navegador.

  ═══ POR QUÉ MONOCROMO Y NO EL DEGRADADO SALVIA ═══

  No es una preferencia nueva: es la decisión de QA de Macha de CU-868ktkwqn — "las 3 líneas
  del logo que sean solo negras o blancas según el tema". El riel de navegación ya la aplica
  (`MachaMark monochrome` en `components/shell/app-shell.tsx`); el favicon era el último lugar
  que seguía con el degradado, así que la pestaña no se parecía al logo de la app.

  El manual prohíbe recolorear el isotipo, y esto no lo hace: `monochrome` es un uso que el
  propio Brand Book contempla, el mismo que ya usa el sidebar.

  ═══ NEGRO EN CLARO, CLARO EN OSCURO — Y NO ES UN AÑADIDO MÍO ═══

  "Según el tema" es literalmente lo que pide ese ticket, y acá el tema NO es el de la app: es
  el del sistema operativo, porque la pestaña se pinta fuera del documento. Un isotipo negro
  fijo sobre la barra de pestañas de un navegador en modo oscuro es casi invisible — o sea que
  "ponerlo negro" a secas no cumple el pedido en la mitad de las pantallas.

  Lo resuelve `prefers-color-scheme` DENTRO del SVG, que es la única vía: el navegador no
  aplica el CSS del documento a un favicon.

  ═══ SE FUE EL TILE OSCURO, Y CON MOTIVO ═══

  La versión anterior posaba el isotipo sobre un cuadrado `#1C2419`. Existía porque el
  degradado salvia llega casi a blanco arriba (#F4F4F2) y sobre una pestaña clara la mitad
  superior de las barras desaparecía. Con tinta monocroma ese problema no existe, así que el
  tile pasó de ser una solución a ser una caja de más: el logo que el usuario ve en la app son
  tres barras sueltas, no un ícono enmarcado.

  ═══ POR QUÉ HEX LITERAL, IGUAL QUE ANTES ═══

  Es la única excepción a "nunca hex" del design guide, y es forzosa: el navegador pinta el
  favicon fuera del documento, así que no hay `:root` donde resolver `var(--foreground)`. Los
  valores son copia exacta de `styles/globals.css` — `--ink` #171717 en `:root` (línea 84) y
  #f2f2f2 en `.dark` (línea 277), que es lo que el sidebar termina heredando por
  `currentColor`. Si cambian allá, hay que cambiarlos acá a mano; hay test que compara los dos.

  La geometría es la MISMA de `components/ui/macha-mark.tsx` y en el mismo `viewBox` de 24:
  tres barras de igual ancho y altura completa. Copiarla en otra escala habría sido la forma de
  que las proporciones se separaran sin que nadie lo note.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <style>
    .bar {
      fill: #171717;
    }
    @media (prefers-color-scheme: dark) {
      .bar {
        fill: #f2f2f2;
      }
    }
  </style>

  <rect class="bar" x="1.5" y="1" width="5.2" height="22" rx="0.6" />
  <rect class="bar" x="9.4" y="1" width="5.2" height="22" rx="0.6" />
  <rect class="bar" x="17.3" y="1" width="5.2" height="22" rx="0.6" />
</svg>
