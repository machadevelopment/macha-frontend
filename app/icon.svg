<!--
  Favicon de la app: el isotipo monocromo (pedido de Keneth, 2026-08-21).

  ═══ CUIDADO AL EDITAR ESTE COMENTARIO: NO PUEDE CONTENER DOS GUIONES SEGUIDOS ═══

  Un SVG servido como `image/svg+xml` se parsea como XML, y XML PROHÍBE la secuencia de dos
  guiones dentro de un comentario. La primera versión de este archivo la tenía dos veces, al
  citar nombres de tokens CSS con su prefijo y al escribir `var(...)` de un token: el archivo
  quedó mal formado, el navegador no lo pudo parsear, y la pestaña mostró el ícono de globo
  genérico. Keneth lo reportó como "me sigue sin aparecer el favicon, aparece un mundo".

  Lo peor del caso es que el archivo se servía perfecto: 200 y `image/svg+xml`. Verifiqué eso
  y no verifiqué que fuera PARSEABLE, que es lo único que el navegador necesita. Ahora hay test
  que lo parsea de verdad (`next.config.test.ts`).

  Por eso los tokens se nombran acá SIN su prefijo de dos guiones: el de tinta es `ink`, el de
  marca es `brand`. No es descuido de estilo, es lo que mantiene el archivo válido.

  ═══ ANTES DE ESTO EL FAVICON NO SE SERVÍA (mismo día, otro bug) ═══

  `middleware.ts` lo interceptaba: su matcher excluía `favicon.ico` (que este proyecto no tiene)
  y no `icon.svg`, que es el archivo real. `GET /icon.svg` respondía 307 hacia api.workos.com,
  así que el navegador pedía el ícono y recibía un redirect al login. Ya está excluido; ver la
  nota larga en `middleware.ts`.

  Los dos bugs son independientes y se apilaron: primero el ícono no llegaba, y cuando empezó a
  llegar, no se podía parsear.

  ═══ POR QUÉ MONOCROMO Y NO EL DEGRADADO SALVIA ═══

  Decisión de QA de Macha, CU-868ktkwqn: "las 3 líneas del logo que sean solo negras o blancas
  según el tema". El riel de navegación ya la aplica (`MachaMark monochrome` en
  `components/shell/app-shell.tsx`); el favicon era el último lugar con el degradado, así que la
  pestaña no se parecía al logo de la app.

  El manual prohíbe recolorear el isotipo y esto no lo hace: `monochrome` es un uso que el propio
  Brand Book contempla, el mismo que ya usa el sidebar.

  ═══ NEGRO EN CLARO, CLARO EN OSCURO ═══

  "Según el tema" es lo que pide ese ticket, y acá el tema NO es el de la app: es el del sistema
  operativo, porque la pestaña se pinta fuera del documento. Un isotipo negro fijo sobre la barra
  de pestañas de un navegador en modo oscuro es casi invisible, o sea que "ponerlo negro" a secas
  no cumple el pedido en la mitad de las pantallas.

  Lo resuelve `prefers-color-scheme` DENTRO del SVG, que es la única vía: el navegador no aplica
  el CSS del documento a un favicon.

  ═══ SE FUE EL TILE OSCURO ═══

  La versión anterior posaba el isotipo sobre un cuadrado oscuro. Existía porque el degradado
  salvia llega casi a blanco arriba y sobre una pestaña clara la mitad superior de las barras
  desaparecía. Con tinta plana ese problema no existe, así que el tile pasó de ser una solución a
  ser una caja de más: el logo que se ve en la app son tres barras sueltas, no un ícono enmarcado.

  ═══ POR QUÉ HEX LITERAL ═══

  Es la única excepción a "nunca hex" del design guide, y es forzosa: el navegador pinta el
  favicon fuera del documento, así que no hay `:root` donde resolver un token. Los valores son
  copia exacta del token `ink` de `styles/globals.css` (#171717 en `:root`, #f2f2f2 en `.dark`),
  que es lo que el sidebar termina heredando por `currentColor`. Si cambian allá hay que
  cambiarlos acá a mano, y hay test que compara los dos.

  La geometría es la MISMA de `components/ui/macha-mark.tsx`, en el mismo viewBox de 24.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <style>
    .bar {
      fill: #171717;
    }
    @media (prefers-color-scheme: dark) {
      .bar {
        fill: #f2f2f2;
      }
    }
  </style>

  <rect class="bar" x="1.5" y="1" width="5.2" height="22" rx="0.6" />
  <rect class="bar" x="9.4" y="1" width="5.2" height="22" rx="0.6" />
  <rect class="bar" x="17.3" y="1" width="5.2" height="22" rx="0.6" />
</svg>
