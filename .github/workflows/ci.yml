name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
      # CU-868khttg2: `build` va en el gate porque typecheck/lint/test pasaron los tres
      # en verde durante días con `next build` completamente roto (una constante
      # exportada desde un archivo "use server"). `main` despliega automáticamente a
      # STAGING, así que un build roto llegaba hasta el deploy sin que nada lo frenara.
      # NEXT_PUBLIC_API_URL es de build-time: sin un valor, la recolección de datos de
      # las rutas puede fallar por un motivo ajeno al código que se está validando.
      - run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
